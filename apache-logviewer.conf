# Apache конфигурация для Log Viewer
# Файл: /etc/httpd/conf.d/logviewer.conf

<VirtualHost *:80>
    ServerName logviewer.company.local
    DocumentRoot /var/www/logviewer

    <Directory /var/www/logviewer>
        Options -Indexes
        AllowOverride None
        Require all granted

        # SPA: все запросы → index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>

    ErrorLog logs/logviewer_error.log
    CustomLog logs/logviewer_access.log combined
</VirtualHost>

