# Apache конфигурация для ReadLog
# Файл: /etc/httpd/conf.d/readlog.conf
#
# Вариант 1: Простой HTTP (без авторизации)
# ============================================================

<VirtualHost *:80>
    ServerName readlog.company.local
    DocumentRoot /var/www/html/readlog

    <Directory /var/www/html/readlog>
        Options -Indexes
        AllowOverride None
        Require all granted

        # SPA: все запросы → index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /readlog
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /readlog/index.html [L]
        </IfModule>
    </Directory>

    ErrorLog logs/readlog_error.log
    CustomLog logs/readlog_access.log combined
</VirtualHost>

